name: check the documentation
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      # The code repository is not checked out here, so code paths and drift are skipped.
      - run: node tools/check.mjs --no-code
