name: Decision
description: A choice that is waiting on the owner.
title: "Decide: "
labels: [decision, from-user, triage]
body:
  - type: markdown
    attributes:
      value: |
        One plain sentence as the title, in the present tense, under 80 characters. Then the five parts below, in plain words. One issue is one thing.
  - type: textarea
    id: what
    attributes:
      label: What
      description: The choice to make, and the options.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: One or two sentences on why it matters.
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: What settles it
      description: What the owner needs to see or know to decide.
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where
      description: The screen or the part of the project this is about. Code paths if you know them.
  - type: textarea
    id: source
    attributes:
      label: Source
      description: Who asked and when. If someone said it, their exact words.
