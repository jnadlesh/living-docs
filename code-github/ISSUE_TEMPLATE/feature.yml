name: Feature
description: Something a person should be able to do.
title: ""
labels: [feature, from-user, triage]
body:
  - type: markdown
    attributes:
      value: |
        One plain sentence as the title, in the present tense, under 80 characters. Then the five parts below, in plain words. One issue is one thing.
  - type: textarea
    id: what
    attributes:
      label: What
      description: What should exist, in one paragraph.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: One or two sentences on why it matters.
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: What done looks like
      description: Things a person can check when it is built, not intentions.
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where
      description: The screen or the part of the project this is about. Code paths if you know them.
  - type: textarea
    id: source
    attributes:
      label: Source
      description: Who asked and when. If someone said it, their exact words.
